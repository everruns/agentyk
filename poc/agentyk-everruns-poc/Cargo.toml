[package]
name = "agentyk-everruns-poc"
description = "Proof of concept: Everruns-flavored policy and metadata composed with Agentyk's canonical engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# A proof-of-boundary prototype, not a shipped crate.
publish = false

[lints]
workspace = true

# The library contains host-neutral policy and metadata over core contracts.
# The facade appears only as a dev-dependency for end-to-end tests.
[dependencies]
agentyk-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
agentyk = { path = "../../crates/agentyk" }
tokio = { workspace = true, features = ["macros", "rt"] }
