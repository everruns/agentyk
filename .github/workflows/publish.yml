name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compare the public API against the last version on crates.io and fail if
  # the version bump doesn't cover the change. Runs here rather than on every
  # PR because that is where a published baseline exists — and because pre-0.1
  # agentyk breaks its API deliberately between releases; what must not happen
  # is shipping a break under a version that claims compatibility.
  semver:
    name: Semver check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # No baseline on the very first publish of a crate — semver-checks
      # reports that and exits non-zero, which is not a failure of this change.
      - name: Check published crates against crates.io
        run: |
          for crate in agentyk-core agentyk-engine agentyk-macros agentyk; do
            if ! curl -sSf "https://crates.io/api/v1/crates/$crate" -o /dev/null; then
              echo "$crate is not published yet — no baseline to compare against, skipping"
              continue
            fi
            cargo semver-checks check-release -p "$crate" --all-features
          done

  # Publish agentyk-core (the contract crate; no internal deps).
  publish-core:
    name: Publish agentyk-core
    runs-on: ubuntu-latest
    needs: semver
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify publish source is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          SOURCE_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Error: publish source $SOURCE_SHA is not reachable from origin/main"
            exit 1
          fi
          echo "Publish source verified on origin/main: $SOURCE_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Publishing runs from a release tag (release event or a manual
          # dispatch on refs/tags/vX.Y.Z), where the tag must match Cargo.toml;
          # or from a manual dispatch on main, which publishes whatever version
          # Cargo.toml carries (the recovery/escape-hatch path). The source is
          # separately verified to be on main below.
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$EVENT_NAME" = "release" ]; then
            TAG_VERSION="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG_VERSION="$CARGO_VERSION"  # dispatched from main: trust Cargo.toml
          else
            echo "Error: manual publish must run from main or a stable release tag"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: ref version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $CARGO_VERSION"

      - name: Publish agentyk-core to crates.io
        run: cargo publish -p agentyk-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish agentyk-engine after its core dependency reaches the index.
  publish-engine:
    name: Publish agentyk-engine
    runs-on: ubuntu-latest
    needs: publish-core
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish agentyk-engine to crates.io
        run: cargo publish -p agentyk-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish the proc-macro implementation before the facade that re-exports it.
  publish-macros:
    name: Publish agentyk-macros
    runs-on: ubuntu-latest
    needs: publish-engine
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish agentyk-macros to crates.io
        run: cargo publish -p agentyk-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish the facade after all internal dependencies reach the index.
  publish-agentyk:
    name: Publish agentyk
    runs-on: ubuntu-latest
    needs: publish-macros
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish agentyk to crates.io
        run: cargo publish -p agentyk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Verify all four crates are visible at the expected version.
  verify-publish:
    name: Verify published versions
    runs-on: ubuntu-latest
    needs: [publish-core, publish-engine, publish-macros, publish-agentyk]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Wait for crates.io propagation
        run: sleep 60

      - name: Verify crates.io versions
        run: |
          EXPECTED=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Expected version: $EXPECTED"
          python3 scripts/verify_crates_publish.py --expected "$EXPECTED" agentyk-core agentyk-engine agentyk-macros agentyk
