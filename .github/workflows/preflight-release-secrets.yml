name: Preflight (release secrets)

# TEMPORARY — verifies CARGO_REGISTRY_TOKEN and the `release` environment are
# wired correctly before the first real release. Delete this file once it has
# gone green (it exists only to validate setup on the PR that adds publishing).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-token:
    name: Validate CARGO_REGISTRY_TOKEN
    runs-on: ubuntu-latest
    # Same context publish.yml uses, so this sees the token whether it was
    # added as a `release` environment secret or a plain repo secret.
    environment: release
    steps:
      - name: Assert token present (value never printed)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # crates.io has no non-destructive token-auth endpoint to validate a
          # publish token against (its /me endpoint is website/cookie-only), so
          # a real publish is the only true test — publish.yml's verify job
          # covers that. Here we confirm the wiring: the secret is set and
          # visible from the exact context publish.yml runs in (the `release`
          # environment). GitHub masks the value in logs.
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty in the 'release' environment (and not a repo secret)."
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is present and visible from the 'release' environment."
          if [ "${#CARGO_REGISTRY_TOKEN}" -lt 20 ]; then
            echo "::warning::Token is unexpectedly short (<20 chars) — double-check it wasn't truncated on paste."
          fi
