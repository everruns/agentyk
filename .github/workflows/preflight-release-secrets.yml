name: Preflight (release secrets)

# TEMPORARY — verifies CARGO_REGISTRY_TOKEN and the `release` environment are
# wired correctly before the first real release. Delete this file once it has
# gone green (it exists only to validate setup on the PR that adds publishing).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-token:
    name: Validate CARGO_REGISTRY_TOKEN
    runs-on: ubuntu-latest
    # Same context publish.yml uses, so this sees the token whether it was
    # added as a `release` environment secret or a plain repo secret.
    environment: release
    steps:
      - name: Assert token present and valid (value never printed)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty in the 'release' environment (and not a repo secret)."
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is present."

          # Confirm the token actually works — crates.io takes the raw API
          # token in the Authorization header (no 'Bearer ' prefix). This
          # catches an expired/mis-pasted/wrong-scope token before release.
          code=$(curl -sS -o body.json -w '%{http_code}' \
            -H "Authorization: $CARGO_REGISTRY_TOKEN" \
            -H "User-Agent: agentyk-release-preflight (github actions)" \
            https://crates.io/api/v1/me)
          echo "crates.io /me -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::crates.io rejected the token (HTTP $code). Check it exists, is unexpired, and has publish scope."
            cat body.json || true
            exit 1
          fi

          # Report which account owns the token (relevant to first-publish
          # name ownership) — login only, no token, no email.
          LOGIN=$(python3 -c "import json;print(json.load(open('body.json'))['user']['login'])")
          echo "Token valid. Authenticated crates.io account: $LOGIN"
