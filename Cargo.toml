[workspace]
resolver = "2"
members = [
    "crates/agentyk-core",
    "crates/agentyk",
    "examples/codenko",
    "poc/agentyk-everruns-poc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Verified in CI (the `msrv` job), not just declared. 1.88 is the floor for
# let-chains in edition 2024, which the turn loop and event log use.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/everruns/agentyk"
homepage = "https://github.com/everruns/agentyk"

# Applied to every member via `lints.workspace = true`. agentyk is a pure-safe
# library: nothing here needs `unsafe`, and forbidding it is a promise the
# compiler keeps for downstream auditors.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Internal (lockstep versions)
agentyk-core = { path = "crates/agentyk-core", version = "0.1.0" }

# Shared external
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
