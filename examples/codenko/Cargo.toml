[package]
name = "codenko"
description = "A small terminal coding agent built on agentyk and tuika."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# The framework: turn loop, event log, capabilities, HTTP drivers.
agentyk = { path = "../../crates/agentyk", default-features = false, features = ["http", "fs"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }

# The TUI: flexbox layout, components, async runner.
tuika = { version = "0.4", features = ["async"] }
# Line/Span/Style, the types tuika components take. Same crate tuika builds on.
ratatui-core = { version = "0.1", features = ["std"] }
# Terminal size before the runner takes over the screen.
crossterm = "0.29"
# Word wrapping for the transcript.
textwrap = "0.16"
# Argument parsing. The library would not take this, but an example is free to:
# hand-rolling means hand-rolling the conventions too (`--flag=value`, `--`,
# suggestions on a typo), and getting those wrong is worse than a dependency.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
