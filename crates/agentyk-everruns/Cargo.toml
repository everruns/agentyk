[package]
name = "agentyk-everruns"
description = "Prototype: everruns-flavored behavior as a satellite over agentyk-core's seams — proof that the extensibility boundary holds with no core change."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# A proof-of-boundary prototype, not a shipped crate.
publish = false

# The library depends ONLY on the contract crate — the whole point: a satellite
# reproduces everruns behavior over agentyk-core's public seams, no framework,
# no tokio, no HTTP. The framework (`agentyk`) appears only as a dev-dependency,
# as the test harness.
[dependencies]
agentyk-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A concurrency combinator (join_all) for parallel tool dispatch — a
# runtime-agnostic utility, NOT a runtime: no tokio, no threads of its own.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
agentyk = { path = "../agentyk" }
tokio = { workspace = true, features = ["macros", "rt"] }
