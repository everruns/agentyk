[package]
name = "agentyk-core"
description = "The agentyk contract: traits, event protocol, and the turn state machine. Implement against this; build with `agentyk`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "ai"]
categories = ["asynchronous"]

# Deliberately lean: no tokio, no HTTP, no process spawning. Everything here
# is either pure data, a trait, or std-only.
[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
