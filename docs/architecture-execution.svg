<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Canonical engine execution cycle</title>
  <desc id="desc">An execution host loads durable events, asks TurnEngine to replay and advance the turn, appends emitted events with optimistic concurrency, and executes or durably schedules the prepared operation.</desc>
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="480" fill="#FFFFFF"/>

  <rect x="20" y="165" width="760" height="295" fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="220" y="155" class="header-text">REPEAT UNTIL FINISHED</text>

  <text x="125" y="40" text-anchor="middle" class="header-text">PERSISTENCE</text>
  <rect x="40" y="55" width="170" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="125" y="86" text-anchor="middle" class="label">Event store</text>
  <text x="125" y="107" text-anchor="middle" class="mono">authoritative events</text>

  <text x="400" y="40" text-anchor="middle" class="header-text">SCHEDULING</text>
  <rect x="315" y="55" width="170" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="86" text-anchor="middle" class="label">Execution host</text>
  <text x="400" y="107" text-anchor="middle" class="mono">in-process or durable</text>

  <text x="675" y="40" text-anchor="middle" class="header-text">SEMANTICS</text>
  <rect x="590" y="55" width="170" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="675" y="86" text-anchor="middle" class="label">TurnEngine</text>
  <text x="675" y="107" text-anchor="middle" class="mono">one interpretation</text>

  <line x1="125" y1="125" x2="125" y2="460" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="400" y1="125" x2="400" y2="460" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="675" y1="125" x2="675" y2="460" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="400" y1="210" x2="135" y2="210" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="135,205 125,210 135,215" fill="#0A1636"/>
  <rect x="246" y="187" width="18" height="18" fill="#0A1636"/>
  <text x="255" y="200" text-anchor="middle" class="step-num">1</text>
  <text x="271" y="200" class="arrow-label">Load events</text>

  <line x1="400" y1="265" x2="665" y2="265" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="665,260 675,265 665,270" fill="#0A1636"/>
  <rect x="500" y="242" width="18" height="18" fill="#0A1636"/>
  <text x="509" y="255" text-anchor="middle" class="step-num">2</text>
  <text x="525" y="255" class="arrow-label">Replay; prepare or apply</text>

  <line x1="675" y1="320" x2="410" y2="320" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="410,315 400,320 410,325" fill="#0A1636"/>
  <rect x="500" y="297" width="18" height="18" fill="#0A1636"/>
  <text x="509" y="310" text-anchor="middle" class="step-num">3</text>
  <text x="525" y="310" class="arrow-label">Events + operation or outcome</text>

  <line x1="400" y1="375" x2="135" y2="375" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="135,370 125,375 135,380" fill="#0A1636"/>
  <rect x="226" y="352" width="18" height="18" fill="#0A1636"/>
  <text x="235" y="365" text-anchor="middle" class="step-num">4</text>
  <text x="251" y="365" class="arrow-label">Append with expected version</text>

  <path d="M 400 420 H 490 V 445 H 410" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="410,440 400,445 410,450" fill="#0A1636"/>
  <rect x="438" y="397" width="18" height="18" fill="#0A1636"/>
  <text x="447" y="410" text-anchor="middle" class="step-num">5</text>
  <text x="462" y="410" class="arrow-label">Execute now or schedule durably</text>
</svg>
